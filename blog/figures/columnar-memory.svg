<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 402" role="img" aria-labelledby="title desc">
<title id="title">Reading one feature: rows vs columns</title>
<desc id="desc">To read the score feature, a row-oriented layout hops from one record object to the next. A columnar layout scans one contiguous scores buffer, while ages and ranks stay in their own buffers.</desc>
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#397bea" stroke-width="1.2"/></marker><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#c9774f" stroke-width="1.2"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#16845a" stroke-width="1.2"/></marker></defs>

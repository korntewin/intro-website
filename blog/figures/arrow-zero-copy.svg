<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 540" role="img" aria-label="Arrow zero-copy slices share original underlying buffer while using different offsets and lengths.">
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#397bea" stroke-width="1.2" /></marker></defs>
<rect x="0" y="0" width="1070" height="540" rx="18" fill="#ffffff" stroke="#dce4f3" stroke-width="1"/>
<text x="28" y="44" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#54647f">ZERO-COPY SLICE</text><text x="28" y="79" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#17213b">Reuse an Arrow buffer instead of duplicating it</text><rect x="26" y="124" width="1016" height="94" rx="15" fill="#f6f8fe" stroke="#dce4f3" stroke-width="1"/><text x="46" y="152" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#17213b">Underlying Arrow primitive buffer (owned/shared memory)</text><rect x="48" y="165" width="90" height="34" rx="5" fill="#eaf2ff" stroke="#dce4f3" stroke-width="1"/><text x="93" y="187" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17213b">0</text><rect x="144" y="165" width="90" height="34" rx="5" fill="#eaf2ff" stroke="#dce4f3" stroke-width="1"/><text x="189" y="187" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17213b">1</text><rect x="240" y="165" width="90" height="34" rx="5" fill="#eaf2ff" stroke="#dce4f3" stroke-width="1"/><text x="285" y="187" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17213b">2</text><rect x="336" y="165" width="90" height="34" rx="5" fill="#eaf2ff" stroke="#dce4f3" stroke-width="1"/><text x="381" y="187" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17213b">3</text><rect x="432" y="165" width="90" height="34" rx="5" fill="#eaf2ff" stroke="#dce4f3" stroke-width="1"/><text x="477" y="187" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17213b">4</text><rect x="528" y="165" width="90" height="34" rx="5" fill="#eaf2ff" stroke="#dce4f3" stroke-width="1"/><text x="573" y="187" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17213b">5</text><rect x="624" y="165" width="90" height="34" rx="5" fill="#eaf2ff" stroke="#dce4f3" stroke-width="1"/><text x="669" y="187" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17213b">6</text><rect x="720" y="165" width="90" height="34" rx="5" fill="#eaf2ff" stroke="#dce4f3" stroke-width="1"/><text x="765" y="187" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17213b">7</text><rect x="816" y="165" width="90" height="34" rx="5" fill="#eaf2ff" stroke="#dce4f3" stroke-width="1"/><text x="861" y="187" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17213b">8</text><rect x="912" y="165" width="90" height="34" rx="5" fill="#eaf2ff" stroke="#dce4f3" stroke-width="1"/><text x="957" y="187" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#17213b">9</text><rect x="28" y="283" width="1014" height="64" rx="12" fill="#ffffff" stroke="#dce4f3" stroke-width="1"/><text x="45" y="308" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#17213b">Slice A: offset 0, len 4</text><line x1="48" y1="325" x2="426" y2="325" stroke="#397bea" stroke-width="9"/><path d="M237.0 321 L237.0 226" stroke="#397bea" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="28" y="386" width="1014" height="64" rx="12" fill="#ffffff" stroke="#dce4f3" stroke-width="1"/><text x="45" y="411" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#17213b">Slice B: offset 4, len 6</text><line x1="432" y1="428" x2="1002" y2="428" stroke="#ed6b3d" stroke-width="9"/><path d="M717.0 424 L717.0 226" stroke="#397bea" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/><text x="32" y="487" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#16845a">A slice can share the original values buffer: metadata changes, payload need not be copied.</text><text x="32" y="514" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#54647f">Note: conversions, casts, aggregations and ONNX input preparation may still allocate.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 860" role="img" aria-labelledby="title desc">
<title id="title">How the local cache stays under its size limit</title>
<desc id="desc">Cache entries ordered from least to most recently used. A hit on B moves B to the most recent end. A miss on F creates a new entry that would exceed the size limit, so the least recently used entry, A, is deleted before F is stored.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.6"/></marker>
<marker id="arrow-hit" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#188676" stroke-width="1.8"/></marker>
</defs>
<rect x="1" y="1" width="1558" height="858" rx="24" fill="#fff" stroke="#d8e2ec"/>
<g font-family="Arial,sans-serif">
<text x="65" y="74" font-size="20" font-weight="700" fill="#536582">ENGINEERING NOTES / SCCACHE</text>
<text x="65" y="135" font-size="42" font-weight="800" fill="#19233e">How the local cache stays under its size limit</text>
<text x="65" y="180" font-size="24" fill="#536582">Least recently used (LRU) eviction in the local disk cache.</text>

<text x="380" y="232" font-size="17" font-weight="700" fill="#536582">LEAST RECENTLY USED</text>
<path d="M595 226 H1035" fill="none" stroke="#c3cfdc" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1260" y="232" font-size="17" font-weight="700" fill="#536582" text-anchor="end">MOST RECENTLY USED</text>

<g font-size="24" font-weight="700" fill="#19233e" text-anchor="middle">
<text x="65" y="285" font-size="20" text-anchor="start">1 · CURRENT CACHE</text>
<text x="65" y="311" font-size="17" font-weight="400" fill="#536582" text-anchor="start">ordered by last use</text>
<rect x="380" y="255" width="900" height="70" rx="12" fill="#f4f8fc" stroke="#d8e2ec" stroke-width="2"/>
<rect x="383" y="258" width="174" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="470" y="299">A</text>
<rect x="563" y="258" width="134" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="630" y="299">B</text>
<rect x="703" y="258" width="184" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="795" y="299">C</text>
<rect x="893" y="258" width="154" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="970" y="299">D</text>
<rect x="1053" y="258" width="124" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="1115" y="299">E</text>
<text x="1400" y="297" font-size="19" font-weight="400" fill="#536582" text-anchor="start">89% full</text>

<path d="M630 328 C630 352 1110 344 1110 362" fill="none" stroke="#188676" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-hit)"/>

<text x="65" y="400" font-size="20" fill="#188676" text-anchor="start">2 · HIT ON B</text>
<text x="65" y="426" font-size="17" font-weight="400" fill="#536582" text-anchor="start">B becomes most recent</text>
<rect x="380" y="370" width="900" height="70" rx="12" fill="#f4f8fc" stroke="#d8e2ec" stroke-width="2"/>
<rect x="383" y="373" width="174" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="470" y="414">A</text>
<rect x="563" y="373" width="184" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="655" y="414">C</text>
<rect x="753" y="373" width="154" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="830" y="414">D</text>
<rect x="913" y="373" width="124" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="975" y="414">E</text>
<rect x="1043" y="373" width="134" height="64" rx="10" fill="#e8f7f2" stroke="#188676" stroke-width="3"/><text x="1110" y="414" fill="#188676">B</text>
<text x="1400" y="412" font-size="19" font-weight="400" fill="#536582" text-anchor="start">89% full</text>

<text x="65" y="515" font-size="20" fill="#b35c35" text-anchor="start">3 · MISS ON F</text>
<text x="65" y="541" font-size="17" font-weight="400" fill="#536582" text-anchor="start">F won't fit under the limit</text>
<text x="470" y="476" font-size="16" fill="#b35c35">evicted first</text>
<text x="1290" y="476" font-size="16" fill="#b35c35" text-anchor="start">over the limit</text>
<rect x="380" y="485" width="900" height="70" rx="12" fill="#f4f8fc" stroke="#d8e2ec" stroke-width="2"/>
<rect x="383" y="488" width="174" height="64" rx="10" fill="#fbfcfe" stroke="#b35c35" stroke-width="2" stroke-dasharray="8 6"/><text x="470" y="529" fill="#8a99ad">A</text>
<rect x="563" y="488" width="184" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="655" y="529">C</text>
<rect x="753" y="488" width="154" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="830" y="529">D</text>
<rect x="913" y="488" width="124" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="975" y="529">E</text>
<rect x="1043" y="488" width="134" height="64" rx="10" fill="#e8f7f2" stroke="#188676" stroke-width="2"/><text x="1110" y="529" fill="#188676">B</text>
<rect x="1183" y="488" width="194" height="64" rx="10" fill="#fff0e8" stroke="#b35c35" stroke-width="3"/><text x="1232" y="529" fill="#b35c35">F</text>
<text x="1400" y="527" font-size="19" fill="#b35c35" text-anchor="start">111% full</text>

<text x="65" y="630" font-size="20" text-anchor="start">4 · EVICT, THEN STORE</text>
<text x="65" y="656" font-size="17" font-weight="400" fill="#536582" text-anchor="start">A, least recent, is deleted</text>
<rect x="380" y="600" width="900" height="70" rx="12" fill="#f4f8fc" stroke="#d8e2ec" stroke-width="2"/>
<rect x="383" y="603" width="184" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="475" y="644">C</text>
<rect x="573" y="603" width="154" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="650" y="644">D</text>
<rect x="733" y="603" width="124" height="64" rx="10" fill="#dbe7f5" stroke="#2265b6" stroke-width="2"/><text x="795" y="644">E</text>
<rect x="863" y="603" width="134" height="64" rx="10" fill="#e8f7f2" stroke="#188676" stroke-width="2"/><text x="930" y="644" fill="#188676">B</text>
<rect x="1003" y="603" width="194" height="64" rx="10" fill="#fff0e8" stroke="#b35c35" stroke-width="2"/><text x="1100" y="644" fill="#b35c35">F</text>
<text x="1400" y="642" font-size="19" font-weight="400" fill="#536582" text-anchor="start">91% full</text>
</g>

<path d="M1280 240 V700" fill="none" stroke="#b35c35" stroke-width="3" stroke-dasharray="10 7"/>
<text x="1280" y="725" font-size="17" font-weight="700" fill="#b35c35" text-anchor="middle">limit: SCCACHE_CACHE_SIZE (default 10 GB)</text>

<rect x="65" y="760" width="1430" height="62" rx="16" fill="#14283b"/>
<text x="88" y="799" font-size="22" font-weight="700" fill="#fff">Entries that keep hitting stay warm; results for old toolchains and versions age out.</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1110" viewBox="0 0 1280 1110" role="img" aria-labelledby="memory-title memory-desc">
<title id="memory-title">200 float32 features: Go row maps versus Arrow columns</title>
<desc id="memory-desc">Illustrative Go 1.24 64-bit memory estimate for one map[string]any per record, containing 200 dynamic float32 values with shared key strings. Each map reserves 256 slots in 32 Swiss groups. The group array allocates approximately 9,472 bytes; map and table metadata plus references add 96 bytes; boxed values add 800 bytes. Total: approximately 10,368 bytes per record. Arrow has 200 Float32 columns: 800 bytes of values plus 25 bytes of validity per record. For 1,000 records, Go maps use approximately 10.368 MB versus Arrow 0.825 MB. For 10,000 records, Go maps use approximately 103.680 MB versus Arrow 8.250 MB. Go maps divided by Arrow values and validity is approximately 12.6. These are layout estimates, not production memory or RSS measurements; shared key contents and Arrow metadata, padding, and spare capacity are excluded.</desc>
<rect x="0" y="0" width="1280" height="1110" rx="20" fill="#F8FBFF" stroke="#DCE5F0" stroke-width="1.5"/>
<text x="42" y="47" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#58708B" text-anchor="start">MEMORY LAYOUT  •  200 FLOAT32 FEATURES PER RECORD</text>
<text x="42" y="94" font-family="Inter,Arial,Helvetica,sans-serif" font-size="35" font-weight="800" fill="#192B43" text-anchor="start">Go row maps vs Apache Arrow columns</text>
<text x="42" y="130" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#667991" text-anchor="start">Same values, different storage: map overhead is shared across 200 features.</text>
<rect x="38" y="160" width="584" height="448" rx="16" fill="#FFF9F5" stroke="#EFDED3" stroke-width="1.5"/>
<rect x="658" y="160" width="584" height="448" rx="16" fill="#F1FBF7" stroke="#CCEADB" stroke-width="1.5"/>
<text x="64" y="201" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#AE6038" text-anchor="start">Go: []map[string]any</text>
<text x="64" y="234" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#825A45" text-anchor="start">One map per record · 200 dynamic float32 values</text>
<rect x="64" y="258" width="532" height="34" rx="6" fill="#F4DBCA" stroke="none" stroke-width="1"/>
<rect x="64" y="258" width="415.625" height="34" rx="6" fill="#D78554" stroke="none" stroke-width="1"/>
<text x="270" y="282" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">200 used</text>
<text x="537" y="282" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#784E36" text-anchor="middle">56 spare</text>
<text x="64" y="320" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#784E36" text-anchor="start">256 reserved slots = 32 groups of 8</text>
<text x="64" y="351" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#825A45" text-anchor="start">Each slot: 16 B string header + 16 B any</text>
<text x="64" y="381" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#825A45" text-anchor="start">32 × (8 B control + 8 × 32 B) = 8,448 B</text>
<text x="64" y="421" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#784E36" text-anchor="start">Group array, allocator rounded</text>
<text x="596" y="421" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#AE6038" text-anchor="end">9,472 B</text>
<text x="64" y="458" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#784E36" text-anchor="start">Map / table / directory / slice reference</text>
<text x="596" y="458" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#AE6038" text-anchor="end">96 B</text>
<text x="64" y="495" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#784E36" text-anchor="start">Boxed values: 200 × 4 B (tiny-packed)</text>
<text x="596" y="495" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#AE6038" text-anchor="end">800 B</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 520" role="img" aria-labelledby="title desc">
<title id="title">Where does the CPU time go?</title>
<desc id="desc">Five stages of one prediction request: 500 to 10,000 candidate items, feature data, preprocessing, ONNX Runtime and ranking scores. Feature lookups and cache misses happen while reading feature data, copies and allocations during preprocessing, and thread contention across preprocessing and inference.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Three forms of Rust build reuse</title>
  <desc id="desc">Cargo reuses fresh target artifacts, rustc incremental compilation reuses parts of a crate, and sccache restores eligible compiler outputs.</desc>
  <rect x="0" y="0" width="1000" height="280" fill="#f7f4ed"/>
  <path d="M340 37V245" fill="none" stroke="#c9c9bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M660 37V245" fill="none" stroke="#c9c9bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(181 0)">
  <path d="M-69 84H-19L-4 67H69V153H-69Z" fill="#e1e5e4" stroke="#536570" stroke-width="3"/>
  <path d="M-40 108H39 M-40 128H23" fill="none" stroke="#536570" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="0" y="206" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#252b29">Cargo</text>
  <text x="0" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#535951">Build artifacts</text>
  </g>
  <g transform="translate(500 0)">
  <rect x="-67" y="69" width="39" height="39" fill="#e1e5e4"/>
  <rect x="-67" y="114" width="39" height="39" fill="#d9e8de"/>
  <rect x="-22" y="69" width="39" height="39" fill="#e1e5e4"/>
  <rect x="-22" y="114" width="39" height="39" fill="#d9e8de"/>
  <rect x="23" y="69" width="39" height="39" fill="#e1e5e4"/>
  <rect x="23" y="114" width="39" height="39" fill="#d9e8de"/>
  <rect x="-22" y="69" width="39" height="39" fill="#21685d"/>
  <rect x="23" y="114" width="39" height="39" fill="#21685d"/>
  <text x="0" y="206" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#252b29">Incremental rustc</text>
  <text x="0" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#535951">Parts of a crate</text>
  </g>
  <g transform="translate(819 0)">
  <rect x="-65" y="70" width="130" height="83" fill="#eeddd1" stroke="#a3452f" stroke-width="3"/>
  <path d="M-64 110H64 M-16 90H16 M-16 131H16" fill="none" stroke="#a3452f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="0" y="206" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#252b29">sccache</text>
  <text x="0" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#535951">Compiler outputs</text>
  </g>
</svg>

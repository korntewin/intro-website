<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 760" role="img" aria-label="Three ways to avoid repeated work"><rect x="1" y="1" width="1558" height="758" rx="24" fill="#ffffff" stroke="#d8e2ec"/><text x="65" y="74" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#536582">ENGINEERING NOTES / SCCACHE</text><text x="65" y="135" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#19233e">Three ways to avoid repeated work</text><text x="65" y="180" font-family="Arial,sans-serif" font-size="24" fill="#536582">Each layer makes a different decision.</text>
<rect x="65.0" y="250" width="453.3333333333333" height="300" rx="18" fill="#f4f8fc" stroke="#2265b6" stroke-width="2"/><rect x="65.0" y="250" width="453.3333333333333" height="9" rx="4" fill="#2265b6"/><text x="87.0" y="310" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2265b6">CARGO OUTPUTS</text>
<text x="87.0" y="365" font-family="Arial,sans-serif" font-size="20" fill="#19233e">Keeps target/ artifacts</text>
<text x="87.0" y="404" font-family="Arial,sans-serif" font-size="20" fill="#19233e">Fresh unit? Skip rustc.</text>
<path d="M524.3333333333333 400h23m-8-8 8 8-8 8" fill="none" stroke="#536582" stroke-width="3"/>
<rect x="553.3333333333333" y="250" width="453.3333333333333" height="300" rx="18" fill="#f4f8fc" stroke="#188676" stroke-width="2"/><rect x="553.3333333333333" y="250" width="453.3333333333333" height="9" rx="4" fill="#188676"/><text x="575.3333333333333" y="310" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#188676">RUST INCREMENTAL</text>
<text x="575.3333333333333" y="365" font-family="Arial,sans-serif" font-size="20" fill="#19233e">Reuses parts of a crate</text>
<text x="575.3333333333333" y="404" font-family="Arial,sans-serif" font-size="20" fill="#19233e">Speeds up edit / build loops.</text>
<path d="M1012.6666666666665 400h23m-8-8 8 8-8 8" fill="none" stroke="#536582" stroke-width="3"/>
<rect x="1041.6666666666665" y="250" width="453.3333333333333" height="300" rx="18" fill="#f4f8fc" stroke="#b35c35" stroke-width="2"/><rect x="1041.6666666666665" y="250" width="453.3333333333333" height="9" rx="4" fill="#b35c35"/><text x="1063.6666666666665" y="310" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#b35c35">SCCACHE</text>
<text x="1063.6666666666665" y="365" font-family="Arial,sans-serif" font-size="20" fill="#19233e">Caches compiler results</text>
<text x="1063.6666666666665" y="404" font-family="Arial,sans-serif" font-size="20" fill="#19233e">Reuses eligible invocations.</text>
<rect x="65" y="605" width="1430" height="94" rx="16" fill="#14283b"/><text x="88" y="660" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">A Cargo-fresh build may never ask sccache to do anything.</text></svg>
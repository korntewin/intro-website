<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 760" role="img" aria-labelledby="title desc">
<title id="title">What happens on a cache lookup?</title>
<desc id="desc">Compiler inputs determine a cache key. A cache hit restores outputs; a miss invokes the compiler and stores eligible results. Unsupported requests pass through.</desc>
<rect x="1" y="1" width="1558" height="758" rx="24" fill="#fff" stroke="#d8e2ec"/>
<g font-family="Arial,sans-serif"><text x="65" y="74" font-size="20" font-weight="700" fill="#536582">ENGINEERING NOTES / SCCACHE</text><text x="65" y="135" font-size="42" font-weight="800" fill="#19233e">What happens on a cache lookup?</text><text x="65" y="180" font-size="24" fill="#536582">Each eligible compiler request is checked independently.</text>
<rect x="65" y="305" width="375" height="210" rx="18" fill="#f4f8fc" stroke="#2265b6" stroke-width="2"/><text x="90" y="360" font-size="26" font-weight="700" fill="#2265b6">1 / INPUTS</text><text x="90" y="405" font-size="21" fill="#19233e">Compiler + arguments</text><text x="90" y="443" font-size="21" fill="#19233e">Source + relevant environment</text>
<rect x="500" y="305" width="365" height="210" rx="18" fill="#f4f8fc" stroke="#188676" stroke-width="2"/><text x="525" y="360" font-size="26" font-weight="700" fill="#188676">2 / LOOKUP</text><text x="525" y="405" font-size="21" fill="#19233e">Compute cache key</text><text x="525" y="443" font-size="21" fill="#19233e">Check configured storage</text>
<rect x="1000" y="230" width="495" height="150" rx="18" fill="#e8f7f2" stroke="#188676" stroke-width="2"/><text x="1025" y="280" font-size="26" font-weight="700" fill="#188676">HIT</text><text x="1025" y="325" font-size="21" fill="#19233e">Restore cached outputs and return result</text>
<rect x="1000" y="430" width="495" height="150" rx="18" fill="#fff0e8" stroke="#b35c35" stroke-width="2"/><text x="1025" y="480" font-size="26" font-weight="700" fill="#b35c35">MISS</text><text x="1025" y="525" font-size="21" fill="#19233e">Compile, then store eligible successful output</text>
<g fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M450 410h40m-10-10 10 10-10 10"/><path d="M865 410h65v-105h60m-10-10 10 10-10 10"/><path d="M930 410v95h60m-10-10 10 10-10 10"/></g>
<rect x="65" y="625" width="1430" height="74" rx="16" fill="#14283b"/><text x="88" y="672" font-size="22" font-weight="700" fill="#fff">Unsupported requests pass through to the compiler without a cache entry.</text></g></svg>

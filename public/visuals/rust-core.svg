<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" role="img" aria-labelledby="t d">
  <title id="t">Rust-inspired inference system</title>
  <desc id="d">An animated technical illustration with request input, preprocessing, a rotating orange Rust gear, and a prediction output.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24383E"/><stop offset="1" stop-color="#101C23"/></linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB179"/><stop offset=".5" stop-color="#FA753F"/><stop offset="1" stop-color="#BE4A2C"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A0C9BB"/><stop offset="1" stop-color="#43636B"/></linearGradient>
    <pattern id="dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7DADB1" opacity=".22"/></pattern>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="180%"><feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#07171D" flood-opacity=".3"/></filter>
  </defs>
  <style>
    .gear { transform-origin:303px 275px; animation:spin 46s linear infinite; }
    .packet { animation:packets 10s linear infinite; stroke-dasharray:7 13; }
    .blink { animation:blink 2.8s ease-in-out infinite; }
    .mini-bar { animation:breathe 4s ease-in-out infinite; transform-origin:bottom; }
    @keyframes spin {to{transform:rotate(360deg)}}
    @keyframes packets {to{stroke-dashoffset:-200}}
    @keyframes blink {50%{opacity:.22}}
    @keyframes breathe {50%{transform:scaleY(.63)}}
    @media (prefers-reduced-motion:reduce) {.gear,.packet,.blink,.mini-bar{animation:none}}
    text { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  </style>

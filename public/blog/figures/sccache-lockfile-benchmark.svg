<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">CI wall time after a lockfile change</title>
  <desc id="desc">The cold archive-cache run was 10 minutes, and the warm sccache run was 6 minutes 28 seconds, 35.3 percent less. This compares two complete CI cache configurations.</desc>
  <rect x="0" y="0" width="1000" height="300" fill="#f7f4ed"/>
  <text x="50" y="55" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#252b29">Archive cache</text>
  <text x="50" y="88" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#535951">Cold</text>
  <text x="50" y="141" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#252b29">sccache</text>
  <text x="50" y="174" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#535951">Warm</text>
  <rect x="280" y="45" width="540" height="45" fill="#536570"/>
  <rect x="280" y="131" width="349.2" height="45" fill="#21685d"/>
  <text x="836" y="77" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#252b29">10m 00s</text>
  <text x="645" y="163" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#21685d">6m 28s</text>
  <path d="M280 37V194" fill="none" stroke="#c9c9bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M629.2 204V220H820V204" fill="none" stroke="#21685d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="724.6" y="261" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#21685d">35.3% less time</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 466" role="img" aria-label="Strict floating point sum compared with possible algebraic reassociation and SIMD potential.">
<defs><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#397bea" stroke-width="1.2" /></marker></defs>
<rect x="0" y="0" width="1070" height="466" rx="18" fill="#ffffff" stroke="#dce4f3" stroke-width="1"/>
<text x="28" y="44" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#54647f">FLOATING-POINT OPTIMIZATIONS</text><text x="28" y="79" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#17213b">Explicit algebraic operations can unlock reassociation</text><rect x="30" y="115" width="493" height="280" rx="14" fill="#f6f8fe" stroke="#dce4f3" stroke-width="1"/><rect x="546" y="115" width="493" height="280" rx="14" fill="#f6f8fe" stroke="#dce4f3" stroke-width="1"/><text x="54" y="151" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#17213b">Strict order</text><text x="574" y="151" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#17213b">Possible algebraic reassociation</text><text x="54" y="210" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#397bea">(((a + b) + c) + d)</text><text x="570" y="210" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#ed6b3d">(a + b) + (c + d)</text><text x="54" y="262" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#54647f">One dependent chain</text><text x="570" y="262" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#54647f">Two partial sums may run in parallel</text><text x="54" y="300" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#54647f">Preserves language-defined FP order</text><text x="570" y="300" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#16845a">May help vectorization</text><text x="30" y="435" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#54647f">Trade-off: different rounding and special-value handling; test numerical parity.</text>
</svg>
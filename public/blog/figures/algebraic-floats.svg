<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 364" role="img" aria-labelledby="title desc">
  <title id="title">Two evaluation orders for a sum</title>
  <desc id="desc">Strict (((a + b) + c) + d) is a chain. Reassociated (a + b) + (c + d) has two independent partial sums that may run in parallel.</desc>
  <rect x="0" y="0" width="1000" height="364" fill="#f7f4ed"/>
  <text x="59" y="61" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#252b29">Strict order</text>
  <text x="555" y="61" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#252b29">Reassociated</text>
  <path d="M500 39V321" fill="none" stroke="#c9c9bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="115" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="29" font-weight="700" fill="#536570">(((a + b) + c) + d)</text>
  <text x="750" y="115" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="29" font-weight="700" fill="#21685d">(a + b) + (c + d)</text>
  <path d="M250 153V260 M611 171L750 260 889 171" fill="none" stroke="#535951" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="191" y="128" width="118" height="58" fill="#e1e5e4"/>
  <text x="250" y="166" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#252b29">a + b</text>
  <rect x="191" y="191" width="118" height="58" fill="#e1e5e4"/>
  <text x="250" y="229" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#252b29">+ c</text>
  <rect x="191" y="254" width="118" height="58" fill="#e1e5e4"/>
  <text x="250" y="292" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#252b29">+ d</text>
  <rect x="552" y="142" width="118" height="58" fill="#d9e8de"/>
  <text x="611" y="180" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#252b29">a + b</text>
  <rect x="830" y="142" width="118" height="58" fill="#d9e8de"/>
  <text x="889" y="180" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#252b29">c + d</text>
  <rect x="691" y="254" width="118" height="58" fill="#d9e8de"/>
  <text x="750" y="292" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#252b29">+</text>
</svg>

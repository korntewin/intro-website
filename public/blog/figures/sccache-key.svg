<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 900" role="img" aria-labelledby="title desc">
<title id="title">What goes into a Rust cache key?</title>
<desc id="desc">sccache hashes the compiler, arguments, source files, dependency contents, environment, and working directory into one key. The same inputs find a stored entry and hit; a changed input produces a different key and misses.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs>
<rect x="1" y="1" width="1558" height="898" rx="24" fill="#fff" stroke="#d8e2ec"/>
<g font-family="Arial,sans-serif">
<text x="65" y="74" font-size="20" font-weight="700" fill="#536582">ENGINEERING NOTES / SCCACHE</text>
<text x="65" y="135" font-size="42" font-weight="800" fill="#19233e">What goes into a Rust cache key?</text>
<text x="65" y="180" font-size="24" fill="#536582">Same inputs, same key, reusable output. Change any one of them and the key changes.</text>

<rect x="50" y="210" width="1460" height="295" rx="20" fill="#fbfcfe" stroke="#d8e2ec" stroke-width="2"/>
<text x="75" y="243" font-size="18" font-weight="700" fill="#536582">INPUTS HASHED FOR ONE RUSTC REQUEST (SCCACHE 0.19.0)</text>

<rect x="70" y="262" width="460" height="105" rx="14" fill="#f4f8fc" stroke="#2265b6" stroke-width="2"/>
<text x="92" y="297" font-size="21" font-weight="700" fill="#2265b6">1 · COMPILER</text>
<text x="92" y="328" font-size="19" fill="#19233e">rustc version + the libraries</text>
<text x="92" y="353" font-size="19" fill="#19233e">in its sysroot</text>

<rect x="550" y="262" width="460" height="105" rx="14" fill="#f4f8fc" stroke="#2265b6" stroke-width="2"/>
<text x="572" y="297" font-size="21" font-weight="700" fill="#2265b6">2 · ARGUMENTS</text>
<text x="572" y="328" font-size="19" fill="#19233e">crate name, edition, --cfg features,</text>
<text x="572" y="353" font-size="19" fill="#19233e">opt-level, target, -C flags</text>

<rect x="1030" y="262" width="460" height="105" rx="14" fill="#f4f8fc" stroke="#2265b6" stroke-width="2"/>
<text x="1052" y="297" font-size="21" font-weight="700" fill="#2265b6">3 · SOURCE FILES</text>
<text x="1052" y="328" font-size="19" fill="#19233e">every file in rustc's dep-info,</text>
<text x="1052" y="353" font-size="19" fill="#19233e">hashed by content</text>

<rect x="70" y="384" width="460" height="105" rx="14" fill="#f4f8fc" stroke="#2265b6" stroke-width="2"/>
<text x="92" y="419" font-size="21" font-weight="700" fill="#2265b6">4 · DEPENDENCIES</text>
<text x="92" y="450" font-size="19" fill="#19233e">contents of each --extern crate</text>
<text x="92" y="475" font-size="19" fill="#19233e">(.rlib / .rmeta) it builds against</text>

<rect x="550" y="384" width="460" height="105" rx="14" fill="#f4f8fc" stroke="#2265b6" stroke-width="2"/>
<text x="572" y="419" font-size="21" font-weight="700" fill="#2265b6">5 · ENVIRONMENT</text>
<text x="572" y="450" font-size="19" fill="#19233e">CARGO_* variables (a few excluded)</text>
<text x="572" y="475" font-size="19" fill="#19233e">+ values read with env!</text>

<rect x="1030" y="384" width="460" height="105" rx="14" fill="#f4f8fc" stroke="#2265b6" stroke-width="2"/>
<text x="1052" y="419" font-size="21" font-weight="700" fill="#2265b6">6 · WORKING DIRECTORY</text>
<text x="1052" y="450" font-size="19" fill="#19233e">where rustc runs, so keep</text>
<text x="1052" y="475" font-size="19" fill="#19233e">CI checkout paths stable</text>

<path d="M780 507 V560" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="800" y="541" font-size="19" font-weight="700" fill="#536582">blake3 hash of all inputs</text>

<text x="65" y="562" font-size="18" font-weight="700" fill="#536582">EXAMPLE</text>
<rect x="65" y="575" width="400" height="92" rx="14" fill="#f4f8fc" stroke="#d8e2ec" stroke-width="2"/>
<text x="88" y="613" font-size="22" font-weight="700" fill="#19233e">Same inputs again</text>
<text x="88" y="645" font-size="18" fill="#536582">e.g. a fresh CI runner</text>
<rect x="530" y="586" width="500" height="70" rx="35" fill="#14283b"/>
<text x="780" y="630" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace">key 7c1e9b…a94f</text>
<rect x="1095" y="575" width="400" height="92" rx="14" fill="#e8f7f2" stroke="#188676" stroke-width="2"/>
<text x="1118" y="613" font-size="24" font-weight="800" fill="#188676">HIT</text>
<text x="1118" y="645" font-size="18" fill="#19233e">entry found, restore outputs</text>

<rect x="65" y="687" width="400" height="92" rx="14" fill="#f4f8fc" stroke="#d8e2ec" stroke-width="2"/>
<text x="88" y="725" font-size="22" font-weight="700" fill="#19233e">One input changed</text>
<text x="88" y="757" font-size="18" fill="#536582">e.g. a feature was enabled</text>
<rect x="530" y="698" width="500" height="70" rx="35" fill="#14283b"/>
<text x="780" y="742" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace">key 2d0483…e17b</text>
<rect x="1095" y="687" width="400" height="92" rx="14" fill="#fff0e8" stroke="#b35c35" stroke-width="2"/>
<text x="1118" y="725" font-size="24" font-weight="800" fill="#b35c35">MISS</text>
<text x="1118" y="757" font-size="18" fill="#19233e">no entry yet, compile then store</text>

<g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"><path d="M470 621 H520"/><path d="M1035 621 H1085"/><path d="M470 733 H520"/><path d="M1035 733 H1085"/></g>

<rect x="65" y="808" width="1430" height="62" rx="16" fill="#14283b"/>
<text x="88" y="847" font-size="22" font-weight="700" fill="#fff">Entries are never edited in place: a changed input simply looks up a different key.</text>
</g></svg>

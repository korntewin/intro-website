  <path d="M445 239C504 239 505 177 566 177" fill="none" stroke="#535951" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M445 317H566" fill="none" stroke="#535951" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M705 177C762 177 762 238 829 238" fill="none" stroke="#535951" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M705 317C762 317 762 238 829 238" fill="none" stroke="#535951" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

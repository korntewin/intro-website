<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Crate cache outcomes after editing core</title>
  <desc id="desc">Editing core causes core and its dependent api to miss. serde, tokio, syn, regex, utils, and metrics hit. The macros proc-macro and the app binary bypass the cache.</desc>

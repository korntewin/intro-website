<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 355" role="img" aria-labelledby="title desc">
  <title id="title">Where Rust fits in prediction</title>
  <desc id="desc">Applied ML uses Python, web and backend services use Go, and the prediction service moves toward low-level ML optimization in Rust, C, and C++.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5 1 9" fill="none" stroke="#21685d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="355" fill="#f7f4ed"/>
  <rect x="60" y="45" width="500" height="119" fill="#e1e5e4"/>
  <rect x="580" y="45" width="360" height="263" fill="#eee3ca"/>
  <rect x="60" y="187" width="500" height="121" fill="#d9e8de"/>
  <text x="87" y="90" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#535951">Applied ML</text>
  <text x="87" y="138" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#536570">Python</text>
  <text x="608" y="90" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#535951">Web services</text>
  <text x="608" y="138" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#536570">Go</text>
  <text x="87" y="231" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#535951">Prediction service</text>
  <text x="87" y="279" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#21685d">Rust · C · C++</text>
  <path d="M451 131V228" fill="none" stroke="#21685d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
  <text x="608" y="274" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#535951">Backend and APIs</text>

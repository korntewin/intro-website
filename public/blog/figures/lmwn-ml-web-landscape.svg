<title id="title">Why Rust fits our next ML layer</title>
<desc id="desc">Applied ML with Python and web services with Go are the current state at LMWN. The prediction service moves down the ML side toward low-level optimization with Rust, C and C++: memory layout, SIMD and execution. Region sizes are not market share.</desc>

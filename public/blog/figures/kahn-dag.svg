<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Preprocessing dependencies</title>
  <desc id="desc">Source A precedes Normalize A, and source B precedes Encode B. Both transformations must finish before the derived feature, which precedes the model input.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5 1 9" fill="none" stroke="#535951" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="340" fill="#f7f4ed"/>
  <path d="M195 102H255" fill="none" stroke="#535951" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M195 237H255" fill="none" stroke="#535951" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M433 102H470Q488 102 488 122V146Q488 169 511 169H535" fill="none" stroke="#535951" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M433 237H470Q488 237 488 215V192Q488 169 511 169H535" fill="none" stroke="#535951" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M743 169H788" fill="none" stroke="#535951" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="50" y="73" width="144" height="58" fill="#e1e5e4"/>
  <text x="122" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Raw A</text>
  <rect x="50" y="208" width="144" height="58" fill="#e1e5e4"/>
  <text x="122" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Raw B</text>
  <rect x="258" y="73" width="174" height="58" fill="#eee3ca"/>
  <text x="345" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Normalize A</text>
  <rect x="258" y="208" width="174" height="58" fill="#eee3ca"/>
  <text x="345" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Encode B</text>
  <rect x="538" y="140" width="204" height="58" fill="#d9e8de"/>
  <text x="640" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#252b29">Derived feature</text>
  <rect x="791" y="140" width="160" height="58" fill="#d9e8de"/>
  <text x="871" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#252b29">Model input</text>
  <path d="M50 301H951" fill="none" stroke="#535951" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="500" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#535951">Dependency order</text>
</svg>

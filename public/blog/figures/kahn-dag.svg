 stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M518 206 L653 257" stroke="#397bea" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M518 341 L653 257" stroke="#397bea" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/><path d="M825 262 L872 262" stroke="#397bea" fill="none" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect x="45" y="405" width="980" height="75" rx="12" fill="#f6f8fe" stroke="#dce4f3" stroke-width="1"/><text x="64" y="437" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#17213b">Indegree 0 → enqueue → visit → decrement dependents → detect cycles</text><text x="64" y="461" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#54647f">Compile dependency order once; execute validated operations for each request.</text>

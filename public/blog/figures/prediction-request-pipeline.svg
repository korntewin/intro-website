<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 272" role="img" aria-labelledby="title desc">
  <title id="title">A prediction request</title>
  <desc id="desc">Candidate items go through feature lookup, preprocessing, and ONNX Runtime inference, which produces ranking scores.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5 1 9" fill="none" stroke="#535951" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="272" fill="#f7f4ed"/>
  <path d="M168 115H266" fill="none" stroke="#535951" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <circle cx="122" cy="115" r="43" fill="#d9e8de"/>
  <text x="122" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#252b29">Candidate</text>
  <text x="122" y="229" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#252b29">items</text>
  <path d="M357 115H455" fill="none" stroke="#535951" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <circle cx="311" cy="115" r="43" fill="#d9e8de"/>
  <text x="311" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#252b29">Feature</text>
  <text x="311" y="229" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#252b29">lookup</text>
  <path d="M546 115H644" fill="none" stroke="#535951" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <circle cx="500" cy="115" r="43" fill="#d9e8de"/>
  <text x="500" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#252b29">Preprocess</text>
  <path d="M735 115H833" fill="none" stroke="#535951" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <circle cx="689" cy="115" r="43" fill="#eeddd1"/>
  <text x="689" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#252b29">ONNX</text>
  <text x="689" y="229" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#252b29">inference</text>

  <circle cx="878" cy="115" r="43" fill="#d9e8de"/>
  <text x="878" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#252b29">Ranking</text>
  <text x="878" y="229" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#252b29">scores</text>
  <circle cx="109" cy="102" r="4" fill="#21685d"/>
  <circle cx="109" cy="115" r="4" fill="#21685d"/>
  <circle cx="109" cy="128" r="4" fill="#21685d"/>

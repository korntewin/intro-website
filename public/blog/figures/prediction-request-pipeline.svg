<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 760" role="img" aria-labelledby="title desc">
<title id="title">Inside one prediction request</title>
<desc id="desc">The flow for 500 to 10,000 items from feature data to preprocessing, ONNX Runtime inference, and ranking scores. Overhead includes feature lookups, allocations, data copies, and thread contention. 200 float32 features occupy 0.8 MB per 1000 items or 8 MB per 10000 items before overhead.</desc>
<rect x="0.5" y="0.5" width="1559" height="759" rx="23" fill="#FFFFFF" stroke="#DAE3ED"/>
<text x="56" y="56" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#536582">REQUEST ANATOMY</text>
<text x="56" y="111" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#19233E">Where does the CPU time go?</text>
<text x="56" y="148" font-family="Arial,sans-serif" font-size="20" fill="#536582">One request may rank thousands of candidates — and move a lot of data along the way.</text><rect x="56" y="207" width="267" height="208" rx="17" fill="#E9F3FF" stroke="#D1DFEA" stroke-width="1.5"/>
<rect x="56" y="207" width="267" height="8" rx="4" fill="#2265B6"/>
<text x="75" y="255" font-family="Arial,sans-serif" font-size="16" font-weight="750" fill="#2265B6">01 · CANDIDATE ITEMS</text>
<text x="75" y="320" font-family="Arial,sans-serif" font-size="24" font-weight="750" fill="#19233E">500–10,000 items</text>
<text x="75" y="352" font-family="Arial,sans-serif" font-size="18" fill="#536582">Incoming request</text><rect x="75" y="381" width="17" height="12" rx="3" fill="#2265B6" opacity="0.38"/><rect x="99" y="381" width="17" height="12" rx="3" fill="#2265B6" opacity="0.5"/><rect x="123" y="381" width="17" height="12" rx="3" fill="#2265B6" opacity="0.62"/><rect x="147" y="381" width="17" height="12" rx="3" fill="#2265B6" opacity="0.74"/><rect x="171" y="381" width="17" height="12" rx="3" fill="#2265B6" opacity="0.86"/><path d="M332 313h17m-6 -7 6 7 -6 7" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="357" y="207" width="267" height="208" rx="17" fill="#E9F3FF" stroke="#D1DFEA" stroke-width="1.5"/>
<rect x="357" y="207" width="267" height="8" rx="4" fill="#2265B6"/>
<text x="376" y="255" font-family="Arial,sans-serif" font-size="16" font-weight="750" fill="#2265B6">02 · FEATURE DATA</text>
<text x="376" y="320" font-family="Arial,sans-serif" font-size="24" font-weight="750" fill="#19233E">Read / assemble</text>
<text x="376" y="352" font-family="Arial,sans-serif" font-size="18" fill="#536582">Per-item features</text><rect x="376" y="381" width="17" height="12" rx="3" fill="#2265B6" opacity="0.38"/><rect x="400" y="381" width="17" height="12" rx="3" fill="#2265B6" opacity="0.5"/><rect x="424" y="381" width="17" height="12" rx="3" fill="#2265B6" opacity="0.62"/><rect x="448" y="381" width="17" height="12" rx="3" fill="#2265B6" opacity="0.74"/><rect x="472" y="381" width="17" height="12" rx="3" fill="#2265B6" opacity="0.86"/><path d="M633 313h17m-6 -7 6 7 -6 7" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="658" y="207" width="267" height="208" rx="17" fill="#E8F7F2" stroke="#D1DFEA" stroke-width="1.5"/>
<rect x="658" y="207" width="267" height="8" rx="4" fill="#188676"/>
<text x="677" y="255" font-family="Arial,sans-serif" font-size="16" font-weight="750" fill="#188676">03 · PREPROCESSING</text>
<text x="677" y="320" font-family="Arial,sans-serif" font-size="24" font-weight="750" fill="#19233E">Transform features</text>
<text x="677" y="352" font-family="Arial,sans-serif" font-size="18" fill="#536582">Dependency-ordered DAG</text><rect x="677" y="381" width="17" height="12" rx="3" fill="#188676" opacity="0.38"/><rect x="701" y="381" width="17" height="12" rx="3" fill="#188676" opacity="0.5"/><rect x="725" y="381" width="17" height="12" rx="3" fill="#188676" opacity="0.62"/><rect x="749" y="381" width="17" height="12" rx="3" fill="#188676" opacity="0.74"/><rect x="773" y="381" width="17" height="12" rx="3" fill="#188676" opacity="0.86"/><path d="M934 313h17m-6 -7 6 7 -6 7" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="959" y="207" width="267" height="208" rx="17" fill="#FFF0E8" stroke="#D1DFEA" stroke-width="1.5"/>
<rect x="959" y="207" width="267" height="8" rx="4" fill="#B35C35"/>
<text x="978" y="255" font-family="Arial,sans-serif" font-size="16" font-weight="750" fill="#B35C35">04 · ONNX RUNTIME</text>
<text x="978" y="320" font-family="Arial,sans-serif" font-size="24" font-weight="750" fill="#19233E">Run inference</text>
<text x="978" y="352" font-family="Arial,sans-serif" font-size="18" fill="#536582">Model execution</text><rect x="978" y="381" width="17" height="12" rx="3" fill="#B35C35" opacity="0.38"/><rect x="1002" y="381" width="17" height="12" rx="3" fill="#B35C35" opacity="0.5"/><rect x="1026" y="381" width="17" height="12" rx="3" fill="#B35C35" opacity="0.62"/><rect x="1050" y="381" width="17" height="12" rx="3" fill="#B35C35" opacity="0.74"/><rect x="1074" y="381" width="17" height="12" rx="3" fill="#B35C35" opacity="0.86"/><path d="M1235 313h17m-6 -7 6 7 -6 7" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1260" y="207" width="267" height="208" rx="17" fill="#E8F7F2" stroke="#D1DFEA" stroke-width="1.5"/>
<rect x="1260" y="207" width="267" height="8" rx="4" fill="#188676"/>
<text x="1279" y="255" font-family="Arial,sans-serif" font-size="16" font-weight="750" fill="#188676">05 · RANKING SCORES</text>
<text x="1279" y="320" font-family="Arial,sans-serif" font-size="24" font-weight="750" fill="#19233E">Return scores</text>
<text x="1279" y="352" font-family="Arial,sans-serif" font-size="18" fill="#536582">Scores for candidates</text><rect x="1279" y="381" width="17" height="12" rx="3" fill="#188676" opacity="0.38"/><rect x="1303" y="381" width="17" height="12" rx="3" fill="#188676" opacity="0.5"/><rect x="1327" y="381" width="17" height="12" rx="3" fill="#188676" opacity="0.62"/><rect x="1351" y="381" width="17" height="12" rx="3" fill="#188676" opacity="0.74"/><rect x="1375" y="381" width="17" height="12" rx="3" fill="#188676" opacity="0.86"/><text x="56" y="479" font-family="Arial,sans-serif" font-weight="800" font-size="20" fill="#19233E">COSTS THAT ADD UP WITH TRAFFIC</text><rect x="56" y="500" width="465" height="88" rx="12" fill="#F8FAFD" stroke="#D8E2EC"/>
<text x="76" y="538" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#19233E">Feature lookups / cache misses</text>
<text x="76" y="566" font-family="Arial,sans-serif" font-size="17" fill="#536582">Pointer chasing when reading features</text><rect x="556" y="500" width="465" height="88" rx="12" fill="#F8FAFD" stroke="#D8E2EC"/>
<text x="576" y="538" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#19233E">Copies / temporary allocations</text>
<text x="576" y="566" font-family="Arial,sans-serif" font-size="17" fill="#536582">Intermediate data and model inputs</text><rect x="1056" y="500" width="465" height="88" rx="12" fill="#F8FAFD" stroke="#D8E2EC"/>
<text x="1076" y="538" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#19233E">Threads competing for CPU</text>
<text x="1076" y="566" font-family="Arial,sans-serif" font-size="17" fill="#536582">Actors and ONNX Runtime thread pools</text><rect x="56" y="617" width="1465" height="102" rx="16" fill="#14283B"/>
<text x="80" y="652" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C3D3E0">ILLUSTRATIVE NUMERIC PAYLOAD · 200 float32 FEATURES PER ITEM</text>
<text x="80" y="693" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#FFFFFF">1,000 items = 0.8 MB</text>
<text x="602" y="693" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#FFFFFF">10,000 items = 8 MB</text>
<text x="1519" y="744" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#64748B">Excludes maps, null metadata, intermediate buffers and tensor preparation.</text>
</svg>
  <rect x="674" y="100" width="30" height="30" fill="none" stroke="#a3452f" stroke-width="3"/>
  <path d="M680 95V102 M690 95V102 M700 95V102 M680 130V135 M690 130V135 M700 130V135" fill="none" stroke="#a3452f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

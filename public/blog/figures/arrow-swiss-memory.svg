<rect x="389" y="241" width="153" height="115" rx="11" fill="#FFFFFF" stroke="#EBD3C3" stroke-width="1.2"/>
<text x="402" y="263" fill="#334559" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start">Record N</text>

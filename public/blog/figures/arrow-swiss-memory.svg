<text x="34" y="668" fill="#556980" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="550" text-anchor="start">Go map size varies with keys, capacity, value types and map count; no fixed per-record comparison.</text>
<text x="34" y="692" fill="#556980" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="start">Bytes shown are Arrow value + bitmap buffers only. No nulls → no bitmap. Alignment/array overhead excluded.</text>

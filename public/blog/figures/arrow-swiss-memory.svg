<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="724" viewBox="0 0 1180 724" role="img" aria-label="Comparison of Go Swiss table row-based maps and Apache Arrow contiguous float32 arrays. One thousand float32 values occupy 4000 bytes, or 4125 with optional validity bitmap. Ten thousand values occupy 40000 bytes, or 41250 with optional validity bitmap. Go map metadata overhead varies by shape.">
<rect x="0" y="0" width="1180" height="724" rx="20" fill="#F8FBFF" stroke="#DBE5F1" stroke-width="1.2"/>
<text x="34" y="44" fill="#60758D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="800" text-anchor="start">MEMORY EFFICIENCY  /  1 FLOAT32 FEATURE PER RECORD</text>
<text x="34" y="89" fill="#17283F" font-family="Inter,Arial,Helvetica,sans-serif" font-size="34" font-weight="800" text-anchor="start">Go Swiss Table vs Apache Arrow</text>
<text x="34" y="121" fill="#61738C" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="450" text-anchor="start">Same 4-byte values. Different metadata and memory layouts.</text>
<rect x="32" y="150" width="541" height="252" rx="16" fill="#FFF9F5" stroke="#F3DFD1" stroke-width="1.2"/>
<rect x="607" y="150" width="541" height="252" rx="16" fill="#F1FBF7" stroke="#CEE9DC" stroke-width="1.2"/>
<text x="53" y="191" fill="#AC5F36" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="start">Go · []map[string]any</text>
<text x="628" y="191" fill="#147F62" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="start">Apache Arrow · Float32 column</text>
<text x="53" y="220" fill="#6D6B6B" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">Swiss table per row → repeated bookkeeping</text>
<text x="628" y="220" fill="#517A6E" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" text-anchor="start">One schema → one contiguous values buffer</text>
<rect x="53" y="241" width="153" height="115" rx="11" fill="#FFFFFF" stroke="#EBD3C3" stroke-width="1.2"/>
<text x="66" y="263" fill="#334559" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="700" text-anchor="start">Record 1</text>

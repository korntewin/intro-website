<rect x="1003" y="310" width="62" height="48" rx="2" fill="#BDE6D2" stroke="#92CEB4" stroke-width="0.9"/>
<text x="1034" y="340" fill="#17684E" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">f32</text>
<rect x="1065" y="310" width="62" height="48" rx="2" fill="#D8F1E7" stroke="#92CEB4" stroke-width="0.9"/>
<text x="1096" y="340" fill="#17684E" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" text-anchor="middle">···</text>
<text x="630" y="381" fill="#39765F" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="650" text-anchor="start">Values: 4 B × N   ·   optional bitmap: 1 bit / row</text>
<text x="34" y="437" fill="#60758D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="800" text-anchor="start">CONCRETE SIZES</text>

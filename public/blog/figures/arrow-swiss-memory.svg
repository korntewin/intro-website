<text x="53" y="491" fill="#1F3550" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="start">1,000 records</text>
<text x="53" y="517" fill="#62758D" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="500" text-anchor="start">Arrow Float32 · optional null bitmap</text>
<rect x="53" y="535" width="474" height="22" rx="6" fill="#E8EEF6" stroke="none" stroke-width="1.2"/>

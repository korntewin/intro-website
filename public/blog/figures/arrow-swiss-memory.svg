<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 342" role="img" aria-labelledby="title desc">
  <title id="title">Estimated feature storage for Go maps and Arrow</title>
  <desc id="desc">At 200 float32 features per record, 1,000 records use 10.368 MB in Go maps and 0.825 MB in Arrow. At 10,000 records, the estimates are 103.68 MB and 8.25 MB. All bars share a scale.</desc>
  <rect x="0" y="0" width="1000" height="342" fill="#f7f4ed"/>
  <rect x="52" y="37" width="18" height="18" fill="#536570"/>
  <text x="82" y="54" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#536570">Go maps</text>
  <rect x="225" y="37" width="18" height="18" fill="#21685d"/>
  <text x="255" y="54" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#21685d">Arrow</text>
  <path d="M287 86V306 M52 196H948" fill="none" stroke="#c9c9bd" stroke-width="2"/>
  <text x="52" y="148" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#252b29">1,000 records</text>
  <rect x="288" y="103" width="50" height="22" fill="#536570"/>
  <text x="353" y="123" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#536570">10.368 MB</text>
  <rect x="288" y="151" width="3.98" height="22" fill="#21685d"/>
  <text x="307" y="171" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#21685d">0.825 MB</text>
  <text x="52" y="260" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#252b29">10,000 records</text>
  <rect x="288" y="217" width="500" height="22" fill="#536570"/>
  <text x="803" y="237" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#536570">103.68 MB</text>
  <rect x="288" y="265" width="39.79" height="22" fill="#21685d"/>
  <text x="343" y="285" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#21685d">8.25 MB</text>
</svg>

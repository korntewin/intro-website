<text x="465.5" y="295" fill="#9A5B39" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">ctrl / slots</text>
<rect x="400" y="310" width="131" height="30" rx="6" fill="#EAF2FF" stroke="none" stroke-width="1.2"/>
<text x="465.5" y="330" fill="#386AA6" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle">key + any(f32)</text>
<text x="53" y="381" fill="#8C6956" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="650" text-anchor="start">8 slots / group + 64-bit control word</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 548" role="img" aria-labelledby="title desc">
<title id="title">Per-model mini-batches from the same request</title>
<desc id="desc">One request with N items goes to model A and model B. Each model splits the items into its own mini-batches and has its own preprocessing and inference actor pools. Batch size, preprocessing workers, and inference workers with ONNX Runtime threads are tuned per model.</desc>

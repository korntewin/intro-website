<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 352" role="img" aria-labelledby="title desc">
  <title id="title">Production medians: Go and Rust</title>
  <desc id="desc">Median P99 latency is 416 ms for Go and 146 ms for Rust. Median max pod CPU is 16.9 versus 3.0 percent. Median max pod memory is 2.68 versus 1.43 GB. Within each metric, the two bars share a scale.</desc>
  <rect x="0" y="0" width="1000" height="352" fill="#f7f4ed"/>
  <rect x="52" y="39" width="18" height="18" fill="#536570"/>
  <text x="82" y="56" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#536570">Go</text>
  <rect x="138" y="39" width="18" height="18" fill="#a3452f"/>
  <text x="168" y="56" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#a3452f">Rust</text>
  <text x="947" y="56" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#535951">Production medians</text>
  <path d="M343 91V309" fill="none" stroke="#c9c9bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M650 91V309" fill="none" stroke="#c9c9bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="123" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#252b29">P99 latency</text>
  <text x="52" y="181" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#536570">416 ms</text>
  <rect x="52" y="193" width="246" height="21" fill="#536570"/>
  <text x="52" y="257" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#a3452f">146 ms</text>
  <rect x="52" y="269" width="86.33653846153845" height="21" fill="#a3452f"/>
  <text x="367" y="123" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#252b29">Max pod CPU</text>
  <text x="367" y="181" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#536570">16.9%</text>
  <rect x="367" y="193" width="246" height="21" fill="#536570"/>
  <text x="367" y="257" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#a3452f">3.0%</text>
  <rect x="367" y="269" width="43.668639053254445" height="21" fill="#a3452f"/>
  <text x="674" y="123" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#252b29">Max pod memory</text>
  <text x="674" y="181" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#536570">2.68 GB</text>
  <rect x="674" y="193" width="246" height="21" fill="#536570"/>
  <text x="674" y="257" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#a3452f">1.43 GB</text>
  <rect x="674" y="269" width="131.26119402985074" height="21" fill="#a3452f"/>

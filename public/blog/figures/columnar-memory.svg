  <rect x="176" y="114" width="87" height="29" fill="#a3452f" opacity="1"/>
  <rect x="271" y="114" width="87" height="29" fill="#536570" opacity="0.42"/>
  <rect x="69" y="170" width="303" height="49" fill="#e1e5e4"/>
  <rect x="81" y="180" width="87" height="29" fill="#21685d" opacity="0.42"/>
  <rect x="176" y="180" width="87" height="29" fill="#a3452f" opacity="1"/>
  <rect x="271" y="180" width="87" height="29" fill="#536570" opacity="0.42"/>
  <rect x="69" y="236" width="303" height="49" fill="#e1e5e4"/>
  <rect x="81" y="246" width="87" height="29" fill="#21685d" opacity="0.42"/>
  <rect x="176" y="246" width="87" height="29" fill="#a3452f" opacity="1"/>
  <rect x="271" y="246" width="87" height="29" fill="#536570" opacity="0.42"/>

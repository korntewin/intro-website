<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 346" role="img" aria-labelledby="title desc">
  <title id="title">Row and column storage</title>
  <desc id="desc">Three features per record are interleaved across separate Go maps. The highlighted feature requires separate lookups. In Arrow the same feature is stored contiguously in one column buffer.</desc>

  <rect x="572" y="180" width="345" height="29" fill="#a3452f" opacity="1"/>
  <path d="M687 180V209" fill="none" stroke="#f7f4ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M802 180V209" fill="none" stroke="#f7f4ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

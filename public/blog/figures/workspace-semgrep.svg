<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
  <title id="title">A shared core with per-application allocator checks</title>
  <desc id="desc">Three example applications share prediction-core. Semgrep checks that each application configures its own global allocator.</desc>
  <rect x="0" y="0" width="1000" height="350" fill="#f7f4ed"/>
  <text x="49" y="52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#252b29">Cargo workspace</text>
  <path d="M49 69H951" fill="none" stroke="#c9c9bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M218 166V213H783V166 M500 166V256" fill="none" stroke="#535951" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="114" y="106" width="208" height="58" fill="#e1e5e4"/>
  <text x="218" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Application A</text>
  <rect x="396" y="106" width="208" height="58" fill="#e1e5e4"/>
  <text x="500" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Application B</text>
  <rect x="679" y="106" width="208" height="58" fill="#e1e5e4"/>
  <text x="783" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Application C</text>
  <rect x="377" y="253" width="246" height="58" fill="#d9e8de"/>
  <text x="500" y="292" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="27" font-weight="700" fill="#21685d">prediction-core</text>
  <path d="M114 92V81H887V92" fill="none" stroke="#a3452f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="950" y="52" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#a3452f">Semgrep: allocator check</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 353" role="img" aria-labelledby="title desc">
  <title id="title">Work on a cache hit, miss, or bypass</title>
  <desc id="desc">A hit hashes, looks up, and restores. A miss hashes, looks up, compiles, and stores. A non-cacheable request runs rustc directly. The segment widths are illustrative.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5 1 9" fill="none" stroke="#535951" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="353" fill="#f7f4ed"/>
  <text x="48" y="106" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#21685d">Hit</text>
  <text x="48" y="185" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#a3452f">Miss</text>
  <text x="48" y="264" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#536570">Bypass</text>
  <rect x="190" y="72" width="100" height="58" fill="#e1e5e4"/>
  <text x="240" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Hash</text>
  <rect x="296" y="72" width="117" height="58" fill="#e1e5e4"/>
  <text x="354.5" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Lookup</text>
  <rect x="190" y="151" width="100" height="58" fill="#e1e5e4"/>
  <text x="240" y="189" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Hash</text>
  <rect x="296" y="151" width="117" height="58" fill="#e1e5e4"/>
  <text x="354.5" y="189" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Lookup</text>
  <rect x="419" y="72" width="132" height="58" fill="#d9e8de"/>
  <text x="485" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Restore</text>
  <path d="M566 101H952" fill="none" stroke="#21685d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 8"/>
  <rect x="419" y="151" width="387" height="58" fill="#eeddd1"/>
  <text x="612.5" y="189" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Compile</text>
  <rect x="812" y="151" width="140" height="58" fill="#eee3ca"/>
  <text x="882" y="189" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Store</text>
  <rect x="190" y="230" width="387" height="58" fill="#e1e5e4"/>
  <text x="383.5" y="268" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#252b29">Compile</text>
  <path d="M190 322H950" fill="none" stroke="#535951" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="48" y="330" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#535951">Time</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="740" viewBox="0 0 1400 740" role="img" aria-label="Arrow LargeList column with four rows, validity bits 1 0 1 1, offsets 0 3 3 3 5, and a contiguous child values buffer of 10 20 30 40 50."><rect x="0" y="0" width="1400" height="740" rx="20" fill="#f8fbff" stroke="#f8fbff" stroke-width="1.4"/><text x="38" y="59" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#17233b" text-anchor="start">Apache Arrow: validity bitmap + LargeList offsets</text><text x="38" y="93" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#566783" text-anchor="start">One list column, three buffers, no per-row heap pointers to list objects</text><rect x="34" y="124" width="410" height="560" rx="14" fill="#ffffff" stroke="#dde6f1" stroke-width="1.4"/><text x="60" y="167" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#17233b" text-anchor="start">Logical column (4 rows)</text><rect x="60" y="201" width="355" height="80" rx="10" fill="#edf5ff" stroke="#dce5f2" stroke-width="1.4"/><text x="76" y="229" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#52627b" text-anchor="start">Row 0</text><text x="185" y="230" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#1e4069" text-anchor="start">[10, 20, 30]</text><text x="185" y="259" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#68768b" text-anchor="start">Valid list</text><rect x="60" y="302" width="355" height="80" rx="10" fill="#fff1f3" stroke="#dce5f2" stroke-width="1.4"/><text x="76" y="330" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#52627b" text-anchor="start">Row 1</text><text x="185" y="331" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#cf4267" text-anchor="start">null</text><text x="185" y="360" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#68768b" text-anchor="start">Null list</text><rect x="60" y="403" width="355" height="80" rx="10" fill="#f2faf5" stroke="#dce5f2" stroke-width="1.4"/><text x="76" y="431" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#52627b" text-anchor="start">Row 2</text><text x="185" y="432" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#1e4069" text-anchor="start">[]</text><text x="185" y="461" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#68768b" text-anchor="start">Valid empty list</text><rect x="60" y="504" width="355" height="80" rx="10" fill="#edf5ff" stroke="#dce5f2" stroke-width="1.4"/><text x="76" y="532" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#52627b" text-anchor="start">Row 3</text><text x="185" y="533" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#1e4069" text-anchor="start">[40, 50]</text><text x="185" y="562" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" fill="#68768b" text-anchor="start">Valid list</text><rect x="468" y="124" width="895" height="164" rx="14" fill="#eefbf4" stroke="#c6ead7" stroke-width="1.4"/><text x="493" y="166" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#14694d" text-anchor="start">1. Validity bitmap</text><text x="493" y="191" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#456a5d" text-anchor="start">One bit per logical row. 1 = present, 0 = null.</text><rect x="755" y="212" width="82" height="52" rx="6" fill="#ffffff" stroke="#b3c8bb" stroke-width="1.4"/><text x="796" y="246" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#19875e" text-anchor="middle">1</text><rect x="850" y="212" width="82" height="52" rx="6" fill="#ffe2ea" stroke="#b3c8bb" stroke-width="1.4"/><text x="891" y="246" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#cf4267" text-anchor="middle">0</text><rect x="945" y="212" width="82" height="52" rx="6" fill="#ffffff" stroke="#b3c8bb" stroke-width="1.4"/><text x="986" y="246" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#19875e" text-anchor="middle">1</text><rect x="1040" y="212" width="82" height="52" rx="6" fill="#ffffff" stroke="#b3c8bb" stroke-width="1.4"/><text x="1081" y="246" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#19875e" text-anchor="middle">1</text><text x="492" y="261" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#3a7d60" text-anchor="start">Optional when every value is valid</text><rect x="468" y="304" width="895" height="169" rx="14" fill="#edf5ff" stroke="#cddcf4" stroke-width="1.4"/><text x="493" y="346" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#1c5bc0" text-anchor="start">2. LargeList offsets</text><text x="493" y="372" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#55708f" text-anchor="start">64-bit integers, number of rows + 1</text><rect x="632" y="392" width="108" height="55" rx="6" fill="#ffffff" stroke="#b5c8e8" stroke-width="1.4"/><text x="686" y="427" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#205db3" text-anchor="middle">0</text><text x="686" y="448" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#63748d" text-anchor="middle">offset[0]</text><rect x="754" y="392" width="108" height="55" rx="6" fill="#ffffff" stroke="#b5c8e8" stroke-width="1.4"/><text x="808" y="427" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#205db3" text-anchor="middle">3</text><text x="808" y="448" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#63748d" text-anchor="middle">offset[1]</text><rect x="876" y="392" width="108" height="55" rx="6" fill="#ffffff" stroke="#b5c8e8" stroke-width="1.4"/><text x="930" y="427" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#205db3" text-anchor="middle">3</text><text x="930" y="448" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#63748d" text-anchor="middle">offset[2]</text><rect x="998" y="392" width="108" height="55" rx="6" fill="#ffffff" stroke="#b5c8e8" stroke-width="1.4"/><text x="1052" y="427" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#205db3" text-anchor="middle">3</text><text x="1052" y="448" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#63748d" text-anchor="middle">offset[3]</text><rect x="1120" y="392" width="108" height="55" rx="6" fill="#ffffff" stroke="#b5c8e8" stroke-width="1.4"/><text x="1174" y="427" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#205db3" text-anchor="middle">5</text><text x="1174" y="448" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400" fill="#63748d" text-anchor="middle">offset[4]</text><rect x="468" y="492" width="895" height="192" rx="14" fill="#fff8ea" stroke="#f1dfbd" stroke-width="1.4"/><text x="493" y="536" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#9e6000" text-anchor="start">3. Shared child values buffer</text><text x="493" y="563" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" fill="#886b42" text-anchor="start">Contiguous integers. Row i reads values[offset[i] : offset[i+1]].</text><rect x="555" y="585" width="130" height="56" rx="6" fill="#fff" stroke="#d3b98d" stroke-width="1.4"/><text x="620" y="622" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#7d5100" text-anchor="middle">10</text><rect x="703" y="585" width="130" height="56" rx="6" fill="#fff" stroke="#d3b98d" stroke-width="1.4"/><text x="768" y="622" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#7d5100" text-anchor="middle">20</text><rect x="851" y="585" width="130" height="56" rx="6" fill="#fff" stroke="#d3b98d" stroke-width="1.4"/><text x="916" y="622" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#7d5100" text-anchor="middle">30</text><rect x="999" y="585" width="130" height="56" rx="6" fill="#fff" stroke="#d3b98d" stroke-width="1.4"/><text x="1064" y="622" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#7d5100" text-anchor="middle">40</text><rect x="1147" y="585" width="130" height="56" rx="6" fill="#fff" stroke="#d3b98d" stroke-width="1.4"/><text x="1212" y="622" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#7d5100" text-anchor="middle">50</text><text x="496" y="666" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="500" fill="#855d30" text-anchor="start">Row 1 is null, row 2 is empty. Both have equal neighboring offsets; bitmap distinguishes them.</text><text x="48" y="717" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500" fill="#63748d" text-anchor="start">LargeList uses 64-bit offsets for large child arrays; List uses 32-bit offsets and can use less offset memory.</text></svg>